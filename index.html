<script>
const W={
home:{t:'Главная',h:`<p>Энциклопедия мультивселенной Ордена: вселенная, лор, персонажи, техника. Ниже сообщество: вопросы, фанатское творчество и общий чат.</p><p class="card"><b>Девиз:</b> «Служим Ордену. Сталь не гнётся.»</p><div class="hub" id="hub"></div><div id="fx"></div>`},
uni:{t:'Вселенная',h:`<h2>Что такое Орден</h2><p>Военно-политическая структура. Началась как частная военная компания в мире, похожем на Землю XXI века, затем захватила родную планету, вышла в космос, открыла межпространственные переходы и создала Коалицию Миров.</p><h2>Ключевые идеи</h2><p><b>Петля:</b> чтобы получить знание, иногда необходимо причинить вред. Это констатация, а не оправдание. Орден не добро и не зло, а необходимость.</p><p>Язык Ордена русский. В документах враг это «лицо, отдалённое от сотрудничества», в быту просто «враг».</p><h2>Структура</h2><div class="tw"><table><tr><th>Часть</th><th>Роль</th></tr><tr><td>ШТАБ-Командас</td><td>«Мозг»: ВРШС, ГУСО, КУБ, КУСПА, СОБ, ОКК, 1-ОКПЭ, Инквизиция, Совет («Круг», 13 членов)</td></tr><tr><td>Амбрелла</td><td>«Руки»: 1-й Научный, 2-й Логический, 3-й Вооружённый, 4-й Политический корпуса</td></tr><tr><td>Комиссары</td><td>Люди, представители ШТАБа внутри Амбреллы; не подчиняются командирам</td></tr></table></div><h2>Миры Коалиции</h2><p>Ядро, Кузницы, Житницы, Академии, Форпосты, Пустые миры, Протектораты, Миры-Аномалии. Восемь Цитаделей (Цитадель-8 уничтожена). Столица: планета «Царствие».</p>`},
lore:{t:'Лор',h:`<h2>История</h2><p>1. Эпоха ЧВК: основатель создаёт «Орден», пишет Устав, стремится стать третейским судьёй. 2. Выход в космос и первый контакт, закончившийся войной. 3. Мультивселенная. 4. Мятеж ШТАБ-Командас: Гендиректор активирует Протокол 224, мятеж подавлен.</p><h2>Гендиректор</h2><p>561973-П, «Девятихвостый». Всегда в чёрной матовой маске без глаз и рта. Лица не видел никто. Настоящее имя: <span class="rd">неизвестно даже Совету</span>. В казармах о нём ходят байки и слухи, но фактами они не являются.</p><h2>Протоколы</h2><p><b>224</b> Гендиректор объявляет структуру предателями (применялся). <b>204</b> Совет объявляет предателем Гендиректора (не применялся).</p><h2>Реформы</h2><p>Вторая Реформа пересмотрела понятие «враг». Директива-719 дала клонам имена, психологическую поддержку и выбор специализации.</p><h2>Клоны</h2><p>Генетический оригинал Иван Ковалёв «Купол» (3829). Инкубация 1 год, подготовка 2 года. Служат только в 3-м корпусе. Не говорят о «долге»: им в радость воевать.</p><h2>Враги</h2><p>Гвардия «Оммеог-6» (мятежные гвардейцы ШТАБа), дройды-автоматоны Предтеч, Улей терродилторов, армия «Воля», Культ «Разлома», «Кровавый Клык», «Красные Ножи».</p>`},
chars:{t:'Персонажи',h:`<div class="hub"><a class="card" href="#h-gen"><b>Гендиректор</b></a><a class="card" href="#h-verd"><b>Верд 3412</b></a><a class="card" href="#h-kein"><b>Кейн 88</b></a><a class="card" href="#h-luna"><b>Луна 3017</b></a><a class="card" href="#h-rubec"><b>Рубец 7405</b></a><a class="card" href="#h-klesh"><b>Клещ 8804</b></a><a class="card" href="#h-iskra"><b>Искра 9915</b></a><a class="card" href="#h-filka"><b>Филька 5193</b></a><a class="card" href="#h-korvo"><b>Корво</b></a></div><p class="mu">Любого героя можно сделать главным в своей истории. «Нельзя менять» обязательно для всех авторов.</p><div class="tw"><table><tr><th>Герой</th><th>Кто</th><th>Нельзя менять</th></tr><tr><td>Гендиректор 561973-П</td><td>Глава Ордена</td><td>Чёрная маска, безликость</td></tr><tr><td>Верд 3412 «Перелом»</td><td>Генерал-клон, 816-й легион</td><td>Путь от рядового до генерала</td></tr><tr><td>Кейн 88</td><td>Комиссар 3-го корпуса</td><td>Человек, валерьянка, рапорты</td></tr><tr><td>Луна 3017</td><td>Клон-унтер-офицер, 32-я рота</td><td>Дневник, философ, инструктор</td></tr><tr><td>Рубец 7405</td><td>Боец 32-й роты</td><td>Два топора, мороженое</td></tr><tr><td>Клещ 8804</td><td>Стрелок-специалист</td><td>Модели кораблей, отчёты</td></tr><tr><td>Искра 9915</td><td>Снайпер, 32-я рота</td><td>Спорщица, опыт Кхайнар-прайм</td></tr><tr><td>Филька 5193</td><td>Клон-генерал</td><td>Ветеран Метро-2033</td></tr><tr><td>Корво</td><td>Командир «Легиона»</td><td>Два топора, шрамы</td></tr><tr><td>Тень 0001</td><td>Командир Спецкорпуса</td><td>Лица не показывает</td></tr></table></div>`},
tech:{t:'Техника',h:`<h2>Броня</h2><p>«Панцирь-М2» (серо-белая, Т-визор, имплант-ключ, нейросеть), М2-Ти (танковая), М2-И (инженерная), М2-Е (медицинская). Элитная: «Легион», «Реквием», Золотая гвардия, Серебряные рыцари.</p><h2>Оружие</h2><p>Винтовка «Град», «Каратель-М», снайперские «Удар» и «Гроза», пулемёты «Оса» и «Гром», пистолеты «Жало» и «Заря», гравипушка «Гатлингор», вибро-клинки «Китленг».</p><h2>Техника</h2><p>Танк «Гроб», БМП «Хаммер», транспортёр «Саркофаг», САУ «Гром», РСЗО «Метла», «Волк», «Тайфун», «Кабан», «Рысь». Авиация: «Пузырь-М», «Дятел», «Гнездо».</p><h2>Флот</h2><p>Крейсер «Апполоний», линкор «Титан», носитель «Улей», транспорт «Ковчег», флагман «Керрас».</p>`},
ranks:{t:'Звания и знаки',h:`<div class="tw"><table><tr><th>Состав</th><th>Звание (сленг)</th><th>Накладка</th></tr><tr><td>Рядовые</td><td>Рядовой («Молоток»), 2-го класса («Старый молоток»)</td><td>Серая</td></tr><tr><td>Унтеры</td><td>Зубец, Хват, Мёртвый хват</td><td>Тёмно-зелёная</td></tr><tr><td>Офицеры</td><td>Тяга, Упор, Перелом</td><td>Белая</td></tr><tr><td>Высшие клоны</td><td>Клон Сердан («Вторая кожа»), Клон-капитан («Стекло»)</td><td>Белая с чёрной окантовкой</td></tr><tr><td>Генералы</td><td>Генерал-клон («Позвонок»)</td><td>Красная с чёрным</td></tr></table></div><h2>Цвета подразделений</h2><p>816-й легион красный, 817-я дивизия оранжевый, 319-й легион ярко-зелёный, 018-й легион голубой, 63-я дивизия синий, 38-я дивизия белый с красным крестом.</p>`}
};
W.rules={t:'Правила',h:`<p>Уважайте участников и канон Ордена. Критиковать идеи можно, людей нельзя.</p><h2>Наказания</h2><div class="tw"><table><tr><th>Нарушение</th><th>Первый раз</th><th>Повтор</th></tr><tr><td>Мат и грубость</td><td>предупреждение</td><td>мут 1 ч, затем 24 ч</td></tr><tr><td>Оскорбление участника</td><td>мут 24 ч</td><td>бан 7 дней</td></tr><tr><td>Спам, флуд, реклама</td><td>мут 1 ч</td><td>мут 24 ч; массовая реклама: бан 30 дней</td></tr><tr><td>Троллинг, провокации</td><td>мут 24 ч</td><td>бан 7 дней</td></tr><tr><td>Дискриминация, разжигание ненависти</td><td>бан 30 дней</td><td>бан навсегда</td></tr><tr><td>Плагиат в творчестве</td><td>удаление работы и предупреждение</td><td>бан 7 дней</td></tr><tr><td>Оффтоп</td><td>предупреждение</td><td>мут 1 ч</td></tr><tr><td>Обход мута или бана</td><td>бан 30 дней</td><td>бан навсегда</td></tr></table></div><h2>Бан навсегда сразу</h2><p>Угрозы и травля. Публикация чужих личных данных. Сексуальный контент, любой сексуальный контент с участием детей. Призывы к насилию. Мошенничество, фишинговые и вредоносные ссылки. Попытки взломать или навредить сайту.</p><h2>Благодарности</h2><p>За помощь новичкам, точные ответы, ценный вклад в канон, качественное творчество и найденные ошибки владелец ставит ★ в списке участников. Особо отличившихся он может отметить званием по своему решению.</p><h2>Апелляция</h2><p>Напишите владельцу в разделе «Вопросы» в течение 7 дней. Срок наказания можно смягчить или увеличить по ситуации.</p><p class="mu">Решения принимают владелец и назначенные им администраторы.</p>`};
W.time={t:'Хронология',h:`<div class="tw"><table><tr><th>Эпоха</th><th>События</th></tr><tr><td>Эпоха ЧВК</td><td>Основатель создаёт ЧВК «Орден», пишет Устав с философией Петли. Орден становится тайным правительством планеты. Генный оригинал клонов Иван Ковалёв «Купол» (3829).</td></tr><tr><td>Выход в космос</td><td>Первый контакт с инопланетной расой заканчивается войной. Орден захватывает технологии межпространственных переходов.</td></tr><tr><td>Мультивселенная</td><td>Экспансия в бесчисленные миры, создание Коалиции, строительство Цитаделей.</td></tr><tr><td>Мятеж ШТАБ-Командас</td><td>Попытка захватить власть. Гендиректор активирует Протокол 224. Ковалёв гибнет, защищая его кабинет. ШТАБ переформирован.</td></tr><tr><td>Реформы</td><td>Вторая Реформа пересматривает понятие «враг». Директива-719 даёт клонам имена, психологическую поддержку и выбор специализации.</td></tr><tr><td>Наши дни</td><td>4825 год. Более пятидесяти миров, восемь Цитаделей (восьмая уничтожена), флот, легионы, союзники.</td></tr></table></div><h2>Эволюция брони</h2><p>«Панцирь-1» (ок. 2250), «Панцирь-М» (ок. 2550), М1 (ок. 3450), М2 (ок. 4250, стандарт), М3 (4820, экспериментальная).</p>`};
W.gloss={t:'Глоссарий',h:`<div class="tw"><table><tr><th>Термин</th><th>Значение</th></tr><tr><td>Петля</td><td>Принцип: знание требует жертв. Констатация, не оправдание.</td></tr><tr><td>Протокол 224</td><td>Гендиректор объявляет структуру предателями. Применялся один раз.</td></tr><tr><td>Протокол 204</td><td>Совет объявляет предателем Гендиректора. Не применялся.</td></tr><tr><td>СКАОС</td><td>Классификация аномалий, классы 0-5 (от безопасного до мультивселенской угрозы).</td></tr><tr><td>Допуски</td><td>От 0 (открытый) до 5 («Чёрный», только Гендиректор).</td></tr><tr><td>Амбрелла</td><td>Исполнительные корпуса, «руки» Ордена.</td></tr><tr><td>ШТАБ-Командас</td><td>Управление, «мозг» Ордена.</td></tr><tr><td>Комиссар</td><td>Человек, представитель ШТАБа в Амбрелле.</td></tr><tr><td>Директива-719</td><td>Права клонов: имя, психоподдержка, выбор специализации.</td></tr><tr><td>Тогдалик</td><td>Высшее звание, связующее звено с ШТАБом («Мост», «Шов»).</td></tr><tr><td>«Свежак»</td><td>Молодой клон после подготовки.</td></tr><tr><td>«Сачки» / «Тихие»</td><td>4-е отделение (захват аномалий) / 3-е (спецназначения).</td></tr><tr><td>Чёрный венок</td><td>Высшая награда клона, вплавляется в шлем. Венки: медный, серебряный, золотой, чёрный.</td></tr></table></div>`};
W.units={t:'Подразделения',h:`<div class="tw"><table><tr><th>Часть</th><th>Командир</th><th>Особенность</th></tr><tr><td>816-й штурмовой легион</td><td>Верд 3412</td><td>Флагман, красная полоса</td></tr><tr><td>333-й общего назначения</td><td>Миротворец 3719</td><td>Серая полоса</td></tr><tr><td>817-я гренадерская дивизия</td><td>Гранит 4507</td><td>Оранжевая, лучевые ружья</td></tr><tr><td>55-й «Сторожа»</td><td>Бастион</td><td>Гарнизонный, оборона</td></tr><tr><td>77-й «Стальная стена»</td><td>Таран</td><td>Бронетанковый</td></tr><tr><td>101-й тяжёлого оружия</td><td>Натиск</td><td>Огневая мощь</td></tr><tr><td>404-й «Сачки»</td><td>Сеть</td><td>Захват аномалий</td></tr><tr><td>888-й «Тихие»</td><td>Шёпот</td><td>Спецоперации</td></tr><tr><td>501-й «Память Республики»</td><td>Хроник</td><td>Серебристо-серый с синим кантом</td></tr><tr><td>28-я егерская дивизия</td><td></td><td>Лес и джунгли, зелёная полоса</td></tr><tr><td>319-й снабжения (2-й корпус)</td><td></td><td>Люди, ярко-зелёная полоса</td></tr><tr><td>12-й инженерный «Зодчие» (2-й корпус)</td><td>Чертёж</td><td>Люди, оранжевая полоса</td></tr><tr><td>38-я санитарно-медицинская</td><td></td><td>Люди, белая с красным крестом</td></tr><tr><td>«Легион»</td><td>Корво</td><td>Личная гвардия Гендиректора, 200 человек</td></tr><tr><td>«Реквием»</td><td></td><td>Космодесант, чёрно-синяя броня</td></tr><tr><td>13-я рота спецразведки</td><td></td><td>Тёмно-бордовая полоса</td></tr></table></div><p class="mu">Клоны служат только в 3-м Вооружённом корпусе.</p>`};
W.auth={t:'Для авторов',h:`<h2>Тон</h2><p>Суровая военная драма с проблесками мрачного юмора. Не гримдарк и не утопия.</p><h2>Табу</h2><p>Слово «Спарта» не используется. Гендиректор всегда в чёрной маске, лица никто не видел. Клоны не бывают комиссарами и не служат вне 3-го корпуса.</p><h2>Язык</h2><p>Русский. Клоны говорят коротко и формально. В документах враг это «лицо, отдалённое от сотрудничества».</p><h2>Как писать историю</h2><p>Выберите героя любого уровня, сохраните его факты из раздела «Нельзя менять», укажите эпоху (до или после мятежа, до или после Директивы-719). Вокруг героя можно придумывать сослуживцев, эпизоды и миры.</p>`};

function catFoot(k){const c=k.slice(0,2)==='h-'?(HER[k.slice(2)]||{}).c:WC[k];return c&&c.length?`<div class="cat">Категории: ${c.map(x=>`<a href="#c-${x}">${CN[x]}</a>`).join(' · ')}</div>`:''}
function pageHero(id){const h=HER[id];main.innerHTML=`<h1>${h.n}</h1><div class="ib"><h3>${h.n}</h3><table>${h.f.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div><p>${h.x}</p><h2>Нельзя менять</h2><p>${h.k}</p><h2>Крючки историй</h2><p>${h.hk}</p>`+catFoot('h-'+id)}
function pageCat(id){if(!CN[id]){location.hash='#home';return}const hs=Object.keys(HER).filter(x=>HER[x].c.includes(id)).map(x=>`<a class="card" href="#h-${x}"><b>${HER[x].n}</b></a>`);const ps=Object.keys(WC).filter(x=>WC[x].includes(id)).map(x=>`<a class="card" href="#${x}"><b>${W[x].t}</b></a>`);main.innerHTML=`<h1>Категория: ${CN[id]}</h1><div class="hub">${ps.concat(hs).join('')}</div>`}

W.col={t:'Расцветки подразделений',h:'<p class="mu">Основа — серо-белый «Панцирь-М2». Полоса на левом наплечнике и правой стороне нагрудника, номер на правом предплечье, эмблема (череп на фоне планеты) на плече и груди.</p>'+T([['Подразделение','Полоса'],['816-й легион','Красная (у Верда белая поверх красной, золотой кант)'],['32-я рота','Красная с белой окантовкой, белая точка на шлеме'],['12-я «Кувалда», 77-й легион','Чёрная с жёлтой окантовкой'],['45-я «Глаз»','Тёмно-синяя, синий треугольник'],['22-я «Сапёры», 12-й инженерный','Оранжевая'],['7-я эскадрилья, 016-я рота «Заслон», 018-й легион','Голубая'],['213-я рота, 28-я дивизия','Зелёная (хаки), лесной камуфляж'],['333-й легион','Тёмно-серая с белой окантовкой'],['55-й «Сторожа»','Тёмно-синяя, щит с черепом'],['404-й «Сачки»','Жёлтая с чёрной окантовкой, жёлтые вставки'],['888-й «Тихие»','Тонкая белая, ночной камуфляж, номера нет'],['319-й снабжения','Ярко-зелёная'],['817-я дивизия','Оранжевая'],['63-я дивизия','Синяя'],['38-я дивизия','Белая с красным крестом'],['501-й «Память Республики»','Серебристо-серая с тёмно-синим кантом'],['110-й полк','Оливковая'],['1-й Научный корпус','Серебристая на белой броне'],['4-й Политический корпус','Белая с золотой окантовкой на тёмно-серой броне'],['13-я рота','Тёмно-бордовая, берет с эмблемой маски с полуулыбкой'],['«Легион»','Золотая на матово-чёрной броне'],['«Реквием»','Серебристая на чёрно-синей'],['Золотая гвардия','Красная на золоте'],['Серебряные рыцари','Тёмно-синяя на серебре']])};
W.skaos={t:'СКАОС и допуски',h:'<h2>Классы аномалий</h2>'+T([['Класс','Описание'],['0. Безопасный','Не представляет угрозы'],['1. Лёгкий','Опасен при контакте, нейтрализуется стандартно'],['2. Умеренный','Требует спецмер и вооружённого сопровождения'],['3. Высокий','Угроза подразделению или объекту, ликвидация силами 3-го корпуса'],['4. Экстремальный','Угроза миру или системе, только наблюдение'],['5. Мультивселенский','Угроза нескольким вселенным, протокол «Иерихон»']])+'<h2>Типы и статусы</h2><p>Типы: Ф (физическая), Б (биологическая), К (когнитивная), Т (темпоральная), Р (реальностная), КВ (квантовая), М (метафизическая), С (смешанная). Статусы: СД (содержится), НБ (наблюдается), НП (не поймана), УН (уничтожена), УТ (утрачена), ИЗ (изолирована).</p><h2>Допуски</h2><p>От 0 (открытый) до 5 («Чёрный», только Гендиректор). Д-ОМЕГА — доступ к протоколам 204 и 224, Д-ИЕРИХОН — к аномалиям 5 класса.</p>'};
W.ethic={t:'Идеология и этика',h:'<h2>Философия</h2>'+T([['Принцип','Суть'],['Петля','Чтобы получить знание, иногда необходимо причинить вред. Это расчёт, не жестокость ради жестокости'],['Жизнь и смерть','Клон смертен. Он не боится смерти, он боится бессмысленной. О погибших не скорбят вслух, номер вносят в архив'],['Отношение к людям','Клоны не ненавидят людей, но и не считают равными. Взаимодействие по Уставу'],['Отношение к ксеносам','Прагматичное: полезных — в союзники, опасных — уничтожить. Расизма нет, есть эффективность'],['Орден — не добро и не зло','Орден — необходимость']])+'<h2>Мета-правила мира</h2><p>Смерть не дешёвая мотивация. Клоны — личности, не расходники. Язык важен: официально «сотрудничество», в быту «враг». Протоколы 204 и 224 — крайние меры. Аномалии документируются, даже если уничтожаются. Техника — инструмент, не культ. Юмор допустим. Трагедия признаётся, но ей противопоставляют дисциплину и солидарность.</p><h2>Что Орден любит и не терпит</h2>'+T([['Любит','Не терпит'],['Порядок, дисциплину, знание, сталь, силу, власть','Хаос, неподчинение, слабость, предательство, анархию, бессмысленные потери']])};
W.struct={t:'Корпуса и штаб',h:'<h2>Четыре корпуса Амбреллы</h2>'+T([['Корпус','Задачи','Клоны'],['1-й Научный (Н-XXXX)','Исследования, клоны, аномалии; 4 отдела: генетика, физика, психология, аномалистика','Нет'],['2-й Логический (Л-XXXX)','Управление, снабжение, связь','Нет'],['3-й Вооружённый','Боевые операции, охрана, захват аномалий','Да'],['4-й Политический (ПЛ-XXXX)','Дипломатия, разведка','Нет']])+'<h2>ШТАБ-Командас</h2>'+T([['Структура','Функция'],['ВРШС «Вышка»','Стратегическое планирование'],['ГУСО «Няньки»','Координация спецопераций; реорганизовано и под надзором'],['КУБ «Бухгалтеры»','Командует СОБ, судебная система'],['КУСПА','Высший суд по нарушениям Устава'],['СОБ «Смотрящие»','Внутренний контроль, аресты, дознания'],['ОКК «Стол»','Координация корпусов Амбреллы'],['1-ОКПЭ «Совесть»','Этический надзор'],['Инквизиция','Действует только по тройному мандату: Гендиректор + Совет + КУБ']])+'<p class="mu">Переходы между Амбреллой и ШТАБом запрещены. В ШТАБе нет клонов.</p>'};

var CP={},CPL=false;
function cpBtn(k){return '<div class="row"><button class="g" onclick="pageNew(\''+k+'\')">✎ Править</button><button class="g" onclick="cpDel(\''+k+'\')">Удалить страницу</button></div>'}
function pageCP(k){main.innerHTML='<h1>'+esc(CP[k].t)+'</h1>'+CP[k].h+(isOwner?cpBtn(k):'')}
function cpDel(k){if(confirm('Удалить страницу?'))db.collection('cpages').doc(k).delete().then(()=>{delete CP[k];location.hash='#home'})}
function pageNew(k){stopAll();if(!isOwner){main.innerHTML='<h1>Новая страница</h1><p class="card">Только для владельца: нажмите «Вход» и войдите своей Google-почтой.</p>';return}
 const c=(k&&CP[k])?CP[k]:{};
 main.innerHTML='<h1>'+(k?'Правка страницы':'Новая страница')+'</h1><div class="card"><input id="cid" placeholder="Адрес латиницей, например: novosti-1" value="'+esc(k||'')+'"'+(k?' readonly':'')+' style="width:100%;margin-bottom:6px"><input id="ct" placeholder="Название" value="'+esc(c.t||'')+'" style="width:100%;margin-bottom:6px"><textarea id="ch" rows="14" style="width:100%" placeholder="Текст страницы (можно с HTML)">'+esc(c.src||'')+'</textarea><div class="row"><button id="cs">Сохранить</button></div><p class="mu">Абзацы разделяйте пустой строкой. Таблицы и оформление можно писать HTML.</p></div>';
 document.getElementById('cs').onclick=async()=>{const id=document.getElementById('cid').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');const t=document.getElementById('ct').value.trim();const src=document.getElementById('ch').value;
  if(!id||!t){toast('Нужны адрес (латиницей) и название.');return}
  if(!k&&(W[id]||CP[id]||['new','home','qa','fan','chat','gal','mem','dev'].includes(id)||id.slice(0,2)==='h-'||id.slice(0,2)==='c-')){toast('Такой адрес уже занят.');return}
  const h=/</.test(src)?src:src.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
  try{await db.collection('cpages').doc(id).set({t:t,h:h,src:src,ts:Date.now()});CP[id]={t:t,h:h,src:src};location.hash='#'+id;route()}catch(e){toast('Не удалось сохранить: войдите как владелец и проверьте правила базы.')}}}
const FB={apiKey:"ВСТАВЬТЕ",authDomain:"ВСТАВЬТЕ",projectId:"ВСТАВЬТЕ",appId:"ВСТАВЬТЕ"};
const OWNER="ВАШ_EMAIL@gmail.com";
var _L=false;
function devId(){let i='';try{i=localStorage.getItem('ord_dev')||'';if(!i){i='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('ord_dev',i)}}catch(e){i='d'+Math.random().toString(36).slice(2,10)}return i}
function devFirst(){let f=Date.now();try{const v=localStorage.getItem('ord_first');if(v)f=+v;else localStorage.setItem('ord_first',String(f))}catch(e){}return f}
function devName(){const u=navigator.userAgent;const m=u.match(/Android[^;)]*;\s*([^;)]+)/)||u.match(/\((iPhone|iPad|Macintosh|Windows[^;)]*|X11[^;)]*|Linux[^;)]*)/);return m?m[1].trim():'Устройство'}
function beat(){if(!db||!uid)return;try{db.collection('devices').doc(devId()).set({uid:uid,name:devName(),ua:navigator.userAgent.slice(0,160),last:Date.now(),first:devFirst()},{merge:true})}catch(e){}}
function fit(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}
function pageDev(){main.innerHTML='<h1>Устройства</h1><div id="dl"></div>';if(!db||!uid){main.innerHTML+='<p class="card">Нет связи с базой. Проверьте интернет.</p>';return}
 if(!isOwner){main.innerHTML+='<p class="card">Только для владельца. Нажмите «Вход» и войдите своей Google-почтой.</p>';return}
 const u=db.collection('devices').orderBy('last').limit(200).onSnapshot(s=>{const el=document.getElementById('dl');if(!el)return;const ds=s.docs.map(d=>({id:d.id,...d.data()})).reverse();const now=Date.now();
  el.innerHTML='<p class="mu">Всего устройств: '+ds.length+'. На связи: '+ds.filter(d=>now-d.last<120000).length+'</p><div class="cg">'+ds.map(d=>{const on=now-d.last<120000;const m=members[d.uid];return '<div class="ci"><h4>'+(on?'● ':'○ ')+esc((m&&m.name)||d.name||'Устройство')+'</h4><p><span>Впервые</span>'+new Date(d.first||d.last).toLocaleString('ru')+'</p><p><span>Последний раз</span>'+new Date(d.last).toLocaleString('ru')+'</p><p><span>Устройство</span>'+esc(d.name||'')+'</p></div>'}).join('')+'</div>'},()=>{});unsub.push(u)}
async function init(){route();renderMe();document.getElementById('lg').onclick=()=>toast(window.firebase?'Настройка Firebase не завершена: вставьте ключи в index.html.':'Firebase не загрузился: проверьте сеть или доступ к сервису Google.');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(!window.firebase||FB.apiKey==='ВСТАВЬТЕ')return;
 try{firebase.initializeApp(FB);db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const au=firebase.auth();
  document.getElementById('lg').onclick=async()=>{const u=au.currentUser;if(u&&!u.isAnonymous){await au.signOut();return}const p=new firebase.auth.GoogleAuthProvider();try{await au.signInWithPopup(p)}catch(e){try{await au.signInWithRedirect(p)}catch(x){}}};
  au.onAuthStateChanged(async u=>{
   if(!u){try{await au.signInAnonymously()}catch(e){}return}
   uid=u.uid;isOwner=!u.isAnonymous&&u.emailVerified&&u.email===OWNER;canEdit=isOwner;
   document.getElementById('lg').textContent=u.isAnonymous?'Вход':'Выйти';
   if(!_L){_L=true;
    db.collection('members').onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());renderMe()},()=>{});
    db.collection('cpages').onSnapshot(s=>{CP={};s.docs.forEach(d=>CP[d.id]=d.data());CPL=true;route()},()=>{CPL=true});db.collection('pages').onSnapshot(s=>{PG={};s.docs.forEach(d=>PG[d.id]=d.data().h);route()},()=>{});
    db.collection('roles').onSnapshot(s=>{roles={};s.docs.forEach(d=>roles[d.id]=d.data());renderMe()},()=>{});
    db.collection('ticker').orderBy('ts').onSnapshot(s=>{const a=s.docs.map(d=>d.data().x).filter(Boolean);setTk(a.length?a:TK)},()=>{});setInterval(beat,60000)}
   beat();syncLocal();renderMe();route()});
 }catch(e){}}
function renderMe(){const m=members[uid];const el=document.getElementById('me');if(!uid){let p={};try{p=JSON.parse(localStorage.getItem('ord_profile')||'{}')}catch(e){}el.innerHTML='<a href="#mem">'+(p.name?esc(p.name):'Присоединиться')+'</a>';return}
 const ow=isOwner?' <span class="tag">владелец</span>':canEdit?' <span class="tag">админ</span>':'';el.innerHTML=(m?`${avOf(uid)}<a href="#mem">${esc(m.name)}</a>`:'<a href="#mem">Присоединиться</a>')+ow}
init();
</script></body></html>
